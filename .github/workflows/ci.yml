name: Verify studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_ci_only
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://studio:studio_ci_only@127.0.0.1:5432/studio_test?sslmode=disable
      TEST_DATABASE_URL: postgres://studio:studio_ci_only@127.0.0.1:5432/studio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go mod download
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go build -trimpath -o bin/studio ./cmd/studio
      - name: Check complete API workflow
        shell: bash
        run: |
          ./bin/studio &
          studio_pid=$!
          trap 'kill "$studio_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          node scripts/acceptance.mjs
          node scripts/acceptance-continuum.mjs
          node scripts/acceptance-workflows.mjs
          node scripts/acceptance-composites.mjs
          node scripts/acceptance-data.mjs
          node scripts/acceptance-state.mjs

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - name: Check container API workflow
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          node scripts/acceptance.mjs
          node scripts/acceptance-continuum.mjs
          node scripts/acceptance-workflows.mjs
          node scripts/acceptance-composites.mjs
          node scripts/acceptance-data.mjs
          node scripts/acceptance-state.mjs
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
